spring:
  application:
    name: math-api
  jackson:
    factory:
      constraints:
        read:
          # UC-004 R-1 (PRD §3.2): fixed request limits, checked by the parser before any value becomes a number.
          max-document-length: 16384
          max-string-length: 1000
          max-number-length: 1000

management:
  endpoint:
    health:
      probes:
        # Boot 4 enables probes by default, which adds a "groups" key to /actuator/health (UC-001 R-2: status only).
        enabled: false
  health:
    readinessstate:
      # Readiness drives /actuator/health: OUT_OF_SERVICE/503 while refusing traffic (UC-001 R-1).
      enabled: true
